name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create MCP config
        run: |
          cat > /tmp/mcp-config.json << 'EOF'
          {
            "mcpServers": {
              "context7": {
                "command": "npx",
                "args": ["-y", "@upstash/context7-mcp@latest"]
              }
            }
          }
          EOF

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Lakukan code review menyeluruh untuk PR ini. Fokus pada:
            1. Kebenaran logika dan potensi bug
            2. Keamanan (SQL injection, input validation, dll.)
            3. Kualitas kode (readability, maintainability)
            4. Kesesuaian dengan arsitektur proyek (modular monolith Spring Boot, module isolation rule, virtual threads, Flyway)
            5. Kelengkapan test coverage

            Jika perlu memverifikasi penggunaan library/framework (Spring Boot, Java, Flyway, dll.),
            gunakan context7 (mcp__context7__resolve-library-id + mcp__context7__query-docs)
            untuk mendapatkan dokumentasi terkini sebelum memberi penilaian.

            Gunakan inline comment untuk isu spesifik di baris kode.
            Gunakan top-level comment untuk observasi umum.

          claude_args: |
            --mcp-config /tmp/mcp-config.json
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__context7__resolve-library-id,mcp__context7__query-docs,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
